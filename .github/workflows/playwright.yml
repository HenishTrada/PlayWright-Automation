name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      test_env:
        description: "Select environment"
        required: true
        default: "qa"
        type: choice
        options:
          - dev
          - qa
          - stage

  push:
    branches: [main, master, Day06-POM_Architecture, Day07-Environment_Configuration, Final_Assignment]
  pull_request:
    branches: [main, master, Day06-POM_Architecture, Day07-Environment_Configuration, Final_Assignment]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TEST_ENV: ${{ github.event.inputs.test_env || 'qa' }}
      PRODUCT_NAME: ${{ vars.PRODUCT_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set BASE_URL by environment
        run: |
          if [ "${TEST_ENV}" = "dev" ]; then
            echo "BASE_URL=${{ secrets.DEV_BASE_URL }}" >> $GITHUB_ENV
          elif [ "${TEST_ENV}" = "qa" ]; then
            echo "BASE_URL=${{ secrets.QA_BASE_URL }}" >> $GITHUB_ENV
          elif [ "${TEST_ENV}" = "stage" ]; then
            echo "BASE_URL=${{ secrets.STAGE_BASE_URL }}" >> $GITHUB_ENV
          else
            echo "Invalid TEST_ENV: ${TEST_ENV}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.TEST_ENV }}
          path: playwright-report/
          retention-days: 30